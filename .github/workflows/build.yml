name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  APP_NAME: IPASigner

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/$APP_NAME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 60

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP_PATH" || { echo ".app не найден"; ls -R build; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          rm -f "$APP_NAME-unsigned.ipa"
          zip -qry "$APP_NAME-unsigned.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPASigner-unsigned-ipa
          if-no-files-found: error
          path: build/IPASigner-unsigned.ipa
