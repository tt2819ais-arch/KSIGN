name: Build iOS (IPA Signer)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  APP_NAME: IPASigner
  # Должен совпадать с bundle id из project.yml (bundleIdPrefix + имя таргета)
  APP_BUNDLE_ID: com.ipasigner.app.IPASigner
  XCODE_VERSION: latest-stable

jobs:
  build:
    name: Build & Archive
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ---------- Необязательное подписание из GitHub Secrets ----------
      # Если секреты не заданы — соберётся НЕподписанный IPA (его можно
      # подписать позже самим приложением IPA Signer / Sideloadly / AltStore).

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Секрет APPLE_CERTIFICATE_BASE64 не задан — сборка БЕЗ подписи."
            echo "UNSIGNED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "UNSIGNED=false" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        if: env.UNSIGNED != 'true'
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      # ---------- Сборка ----------

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          if [ "$UNSIGNED" = "true" ]; then
            echo "Архивация без кодовой подписи…"
            xcodebuild archive \
              -project "$APP_NAME.xcodeproj" \
              -scheme "$APP_NAME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/$APP_NAME.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              | tail -n 40
          else
            echo "Архивация с подписью…"
            xcodebuild archive \
              -project "$APP_NAME.xcodeproj" \
              -scheme "$APP_NAME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/$APP_NAME.xcarchive" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
              | tail -n 40
          fi

      - name: Export signed IPA
        if: env.UNSIGNED != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "build/$APP_NAME.xcarchive" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build \
            | tail -n 20

      - name: Package unsigned IPA
        if: env.UNSIGNED == 'true'
        run: |
          set -euo pipefail
          APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry "$APP_NAME-unsigned.ipa" Payload

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build
          if-no-files-found: error
          path: |
            build/*.ipa
            build/*.xcarchive
